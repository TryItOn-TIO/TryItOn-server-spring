# 배포 빌드 설정
spring.config.import=aws-secretsmanager:tio/db/credentials,aws-secretsmanager:tio/oauth/google,aws-secretsmanager:tio/jwt,aws-secretsmanager:tio/mail,aws-secretsmanager:tio/payments/toss,aws-secretsmanager:tio/secret
# AWS Secrets Manager 민감 정보 가져오기

# springboot devtools 비활성화 (ec2 배포 환경에서는 불필요)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# JPA 설정
# 절대 변경 금지
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 실제 배포된 FastAPI 서버 주소
FastApi.user-service.url=http://10.0.163.170:8000

# AWS Redis 기본 설정
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.protocols=TLSv1.2
spring.data.redis.ssl.verify-peer=false
spring.data.redis.ssl.endpoint-identification-enabled=false
spring.data.redis.timeout=60000
spring.data.redis.connect-timeout=60000
spring.data.redis.lettuce.shutdown-timeout=60000

# Lettuce 기본 Redis 설정
spring.data.redis.lettuce.cluster.verify-hostname=false
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=10000ms
spring.data.redis.lettuce.client.client-name=tio-spring-client
spring.data.redis.lettuce.client.protocol=RESP2
spring.data.redis.lettuce.client.disable-client-setinfo=true

# Cache Redis Configuration
cache.redis.host=${CACHE_REDIS_URL}
cache.redis.port=6379
cache.redis.lettuce.pool.max-active=50
cache.redis.lettuce.pool.max-idle=20
cache.redis.lettuce.pool.min-idle=10
cache.redis.lettuce.pool.max-wait=10000ms
cache.redis.lettuce.client.client-name=tio-cache-client
cache.redis.lettuce.client.protocol=RESP2
cache.redis.lettuce.client.disable-client-setinfo=true

# Redis logging
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG

# Server Resource Optimization
server.tomcat.threads.max=1000
server.tomcat.threads.min-spare=100
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000
server.tomcat.max-keep-alive-requests=10000
server.tomcat.connection-timeout=20000

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# AWS Lambda
aws.lambda.personalized-recommendation.url=${LAMBDA_PERSONALIZED_URL}
aws.lambda.personalized-recommendation.timeout=10
